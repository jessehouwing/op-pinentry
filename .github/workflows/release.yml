name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish Pinentry1Password.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "publish/${{ matrix.rid }}/pinentry-1password.exe" "dist/pinentry-1password-${{ matrix.rid }}.exe"

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $file = "dist/pinentry-1password-${{ matrix.rid }}.exe"
          (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower() + "  " + (Split-Path -Leaf $file) |
            Out-File -FilePath "$file.sha256" -Encoding ascii -NoNewline

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/pinentry-1password-${{ matrix.rid }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinentry-1password-${{ matrix.rid }}
          path: |
            dist/pinentry-1password-${{ matrix.rid }}.exe
            dist/pinentry-1password-${{ matrix.rid }}.exe.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.sha256
